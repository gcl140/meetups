{% extends 'base.html' %}
{% load static %}
{% block title %}Attendance — {{ event.title }}{% endblock %}

{% block content %}
<div id="attendance-root" data-event-slug="{{ event.slug }}" data-user-id="{{ user.id }}" data-is-admin="{{ is_admin|yesno:'true,false' }}"
     class="max-w-xl mx-auto card">
  <h1 class="text-2xl mb-1">Attendance</h1>
  <p class="text-sm text-wood-600 mb-6">{{ event.title }}</p>
  <ul id="attendance-list" class="divide-y divide-wood-100"></ul>
  <a href="{{ event.get_absolute_url }}" class="btn-outline w-full mt-6">Back to event</a>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/attendance.js' %}"></script>
{% endblock %}
