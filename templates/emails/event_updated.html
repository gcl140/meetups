<div style="font-family: Georgia, serif; background:#faf6f1; padding:24px; color:#331f13;">
  <div style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:16px; padding:24px; border:1px solid #e4cdb0;">
    <h2 style="color:#4d2f1c; margin-top:0;">✏️ "{{ event.title }}" was updated</h2>
    <p>Hi {{ user.first_name|default:user.display_name }},</p>
    <p>{{ changed_by.display_name }} just made some changes:</p>
    <ul style="background:#f2e8dc; padding:16px 16px 16px 32px; border-radius:10px; margin:0 0 16px;">
      {% for change in changes %}
        <li>{{ change }}</li>
      {% endfor %}
    </ul>
    <p style="margin:24px 0;">
      <a href="{{ event_url }}" style="background:#6b4327; color:#fffaf3; padding:10px 18px; border-radius:8px; text-decoration:none;">View event</a>
    </p>
    <p style="font-size:13px; color:#8a5732;">An updated calendar file is attached in case any dates moved.</p>
  </div>
</div>
