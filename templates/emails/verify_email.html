<div style="font-family: Georgia, serif; background:#faf6f1; padding:24px; color:#331f13;">
  <div style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:16px; padding:24px; border:1px solid #e4cdb0;">
    <h2 style="color:#4d2f1c; margin-top:0;">📬 Verify your email</h2>
    <p>Hi {{ user.first_name|default:user.display_name }},</p>
    <p>One more step before you can log in to Meetups -- confirm this is your email address.</p>
    <p style="margin:24px 0;">
      <a href="{{ verify_url }}" style="background:#6b4327; color:#fffaf3; padding:10px 18px; border-radius:8px; text-decoration:none;">Verify email</a>
    </p>
    <p style="font-size:13px; color:#8a5732;">If you didn't create a Meetups account, you can ignore this email.</p>
  </div>
</div>
